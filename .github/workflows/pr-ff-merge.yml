name: PR Deployment and FF Merge

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validation
        run: |
          echo "Running validation"
          echo "Validation successful"

  sit-deploy:
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: SIT

    steps:
      - name: SIT Deployment
        run: |
          echo "Deploying to SIT"
          echo "SIT Deployment Successful"

  uat-deploy:
    needs: sit-deploy
    runs-on: ubuntu-latest

    environment:
      name: UAT

    steps:
      - name: UAT Deployment
        run: |
          echo "Deploying to UAT"
          echo "UAT Deployment Successful"

  ff-merge:
    needs: uat-deploy
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fetch All Branches
        run: |
          git fetch origin

      - name: Perform Fast Forward Merge
        run: |
          PR_BRANCH=${{ github.head_ref }}
          BASE_BRANCH=${{ github.base_ref }}

          echo "PR Branch: $PR_BRANCH"
          echo "Base Branch: $BASE_BRANCH"

          git checkout $BASE_BRANCH
          git pull origin $BASE_BRANCH

          git merge --ff-only origin/$PR_BRANCH

          git push origin $BASE_BRANCH

      - name: Close Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          gh pr close ${{ github.event.pull_request.number }} \
            --comment "PR auto merged after SIT and UAT approval using Fast Forward Merge."
